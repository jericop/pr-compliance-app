name: BuildKit multi-arch build

# End-to-end verification of the buildkit-native-export toolchain against the
# published builder (jericop/ubuntu-noble-builder:buildkit-native-export, which
# bundles the pinned lifecycle). It drives a single build backend
# (--build-backend buildkit) through a cold build -> rebuild -> registry-cache
# export -> registry-cache import sequence, verifies the multi-arch manifest, and
# checks the finalized CNB metadata.
#
# The `pack` binary comes from one of two sources:
#   * DEFAULT (build from source): checks out jericop/pack@<pack_ref> and `go build`s
#     it. This is the path that also works locally.
#   * OPTIONAL (published image): if the `pack_image` input is set, the workflow
#     pulls that image and copies the `pack` binary out of it into the runner,
#     instead of building. This verifies the PUBLISHED pack image end-to-end while
#     keeping the rest of the script identical.

on:
  push:
    branches:
      - buildkit-native-export
      - main
  workflow_dispatch:
    inputs:
      pack_image:
        description: >-
          Optional: pull `pack` from this image and copy the binary out instead of
          building from source (e.g. jericop/pack:buildkit-native-export-v0.1.0).
          Leave empty to build pack from source at pack_ref.
        required: false
        default: ""
      pack_ref:
        description: "pack fork git ref to build from when pack_image is empty"
        required: false
        default: "buildkit-native-export"
      builder:
        description: "Builder image to build against"
        required: false
        default: "jericop/ubuntu-noble-builder:buildkit-native-export"
      run_image:
        description: "Run image"
        required: false
        default: "paketobuildpacks/ubuntu-noble-run-tiny:latest"

env:
  # Defaults for push-triggered runs (workflow_dispatch inputs override these).
  PACK_REF: ${{ github.event.inputs.pack_ref || 'buildkit-native-export' }}
  PACK_IMAGE: ${{ github.event.inputs.pack_image || '' }}
  BUILDER: ${{ github.event.inputs.builder || 'jericop/ubuntu-noble-builder:buildkit-native-export' }}
  RUN_IMAGE: ${{ github.event.inputs.run_image || 'paketobuildpacks/ubuntu-noble-run-tiny:latest' }}

jobs:
  buildkit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      # --- pack binary source: build-from-source (default) OR copy-out-of-image ---

      - name: Checkout pack (buildkit fork)
        if: ${{ env.PACK_IMAGE == '' }}
        uses: actions/checkout@v5
        with:
          repository: jericop/pack
          ref: ${{ env.PACK_REF }}
          path: pack-src

      - name: Set up Go
        if: ${{ env.PACK_IMAGE == '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: pack-src/go.mod

      - name: Build pack from source
        if: ${{ env.PACK_IMAGE == '' }}
        run: |
          echo "=== pack from SOURCE (ref: ${PACK_REF}) ==="
          cd pack-src
          go build -o "${GITHUB_WORKSPACE}/pack-bin" .

      - name: Copy pack binary out of published image
        if: ${{ env.PACK_IMAGE != '' }}
        run: |
          echo "=== pack from IMAGE: ${PACK_IMAGE} ==="
          # Runner is amd64; pull the amd64 variant so the extracted binary runs here.
          docker pull --platform linux/amd64 "${PACK_IMAGE}"
          cid="$(docker create --platform linux/amd64 "${PACK_IMAGE}")"
          # The published image's entrypoint is /usr/local/bin/pack.
          docker cp "${cid}:/usr/local/bin/pack" "${GITHUB_WORKSPACE}/pack-bin"
          docker rm "${cid}" >/dev/null

      - name: pack version + enable experimental
        run: |
          chmod +x "${GITHUB_WORKSPACE}/pack-bin"
          "${GITHUB_WORKSPACE}/pack-bin" version
          "${GITHUB_WORKSPACE}/pack-bin" config experimental true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create buildx builder
        run: docker buildx create --name pack-multiplatform --driver docker-container --bootstrap --use

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build 1: Initial build (cold)"
        run: |
          echo "=== INITIAL BUILD (cold) ==="
          time "${GITHUB_WORKSPACE}/pack-bin" build ${{ secrets.DOCKERHUB_ORG }}/pr-compliance-app:buildkit \
            --path . \
            --builder "${BUILDER}" \
            --run-image "${RUN_IMAGE}" \
            --platforms linux/amd64,linux/arm64 \
            --build-backend buildkit \
            --buildkit-builder pack-multiplatform \
            --publish \
            --trust-builder

      - name: "Build 2: Rebuild (buildkit cache)"
        run: |
          echo "=== REBUILD (buildkit vertex cache; buildpacks should be skipped) ==="
          time "${GITHUB_WORKSPACE}/pack-bin" build ${{ secrets.DOCKERHUB_ORG }}/pr-compliance-app:buildkit \
            --path . \
            --builder "${BUILDER}" \
            --run-image "${RUN_IMAGE}" \
            --platforms linux/amd64,linux/arm64 \
            --build-backend buildkit \
            --buildkit-builder pack-multiplatform \
            --publish \
            --trust-builder

      - name: "Build 3: With registry cache export"
        run: |
          echo "=== BUILD WITH REGISTRY CACHE EXPORT ==="
          time "${GITHUB_WORKSPACE}/pack-bin" build ${{ secrets.DOCKERHUB_ORG }}/pr-compliance-app:buildkit \
            --path . \
            --builder "${BUILDER}" \
            --run-image "${RUN_IMAGE}" \
            --platforms linux/amd64,linux/arm64 \
            --build-backend buildkit \
            --buildkit-builder pack-multiplatform \
            --publish \
            --trust-builder \
            --buildkit-cache-to type=registry,ref=${{ secrets.DOCKERHUB_ORG }}/pr-compliance-app:cache-buildkit,mode=max

      - name: "Build 4: From registry cache (fresh runner simulation)"
        run: |
          echo "=== BUILD FROM REGISTRY CACHE (fresh builder) ==="
          docker buildx rm pack-multiplatform
          docker buildx create --name pack-multiplatform --driver docker-container --bootstrap --use
          time "${GITHUB_WORKSPACE}/pack-bin" build ${{ secrets.DOCKERHUB_ORG }}/pr-compliance-app:buildkit \
            --path . \
            --builder "${BUILDER}" \
            --run-image "${RUN_IMAGE}" \
            --platforms linux/amd64,linux/arm64 \
            --build-backend buildkit \
            --buildkit-builder pack-multiplatform \
            --publish \
            --trust-builder \
            --buildkit-cache-from type=registry,ref=${{ secrets.DOCKERHUB_ORG }}/pr-compliance-app:cache-buildkit \
            --buildkit-cache-to type=registry,ref=${{ secrets.DOCKERHUB_ORG }}/pr-compliance-app:cache-buildkit,mode=max

      - name: Verify manifest list
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_ORG }}/pr-compliance-app:buildkit

      - name: Verify CNB metadata is finalized
        run: |
          echo "=== pack image-metadata verify (CI gate: exits non-zero unless finalized) ==="
          "${GITHUB_WORKSPACE}/pack-bin" image-metadata verify ${{ secrets.DOCKERHUB_ORG }}/pr-compliance-app:buildkit
